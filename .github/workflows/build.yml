name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restaurer la cle de signature
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > CloudMedia/cloudmedia.keystore

      - name: Compiler l'APK signe
        working-directory: CloudMedia
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=$(pwd)/cloudmedia.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASSWORD }}

      - name: Recuperer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudMedia-apk
          path: CloudMedia/app/build/outputs/apk/release/app-release.apk
